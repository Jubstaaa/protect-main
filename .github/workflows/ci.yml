name: CI

on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        uses: Jubstaaa/deploy-actions/.github/workflows/quality-gate.yml@f4677f5a29993bfe38facdc282c50ddd1edc9936 # v1.7.0
        with:
            knip: false
            jscpd: false
            depcruise: false

    dist:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build
            - name: The bundle matches the source
              run: |
                  if [ -n "$(git status --porcelain dist/)" ]; then
                      git status --short dist/
                      echo "::error::dist/ is stale. Run bun run build and commit the result."
                      exit 1
                  fi
